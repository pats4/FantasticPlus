name: release-notes

# Rewrite an existing release's description from its CHANGELOG.md section,
# without rebuilding anything (the zip and SHA256SUMS stay as they are).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update (e.g. v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update the release description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          # keep the link to the run that built the release's files
          run="$(gh release view "$TAG" --json body --jq .body | grep -o 'https://github.com/[^ ]*/actions/runs/[0-9]*' | head -n 1 || true)"
          scripts/release-body.sh "$TAG" "$commit" "$run" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
