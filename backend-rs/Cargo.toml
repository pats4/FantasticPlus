[package]
name = "fantastic-rs"
version = "0.9.2"
edition = "2021"
authors = ["NGnius (Graham) <ngniusness@gmail.com>"]
description = "Backend (superuser) functionality for FantasticPlus, based on Fantastic"
license = "GPL-3.0-only"
repository = "https://git.ngni.us/NG-SD-Plugins/Fantastic"
keywords = ["utility", "fan-control", "root", "decky"]
readme = "../README.md"


[dependencies]
usdpl-back = { version = "1.0", features = ["blocking"], path = "../deps/usdpl-rs/usdpl-back"}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"

nrpc = { version = "1.0", path = "../deps/nRPC/nrpc", features = ["async-trait"] }
prost = "0.11"
tokio = { version = "1", features = ["sync", "rt"] }

sysfuss = { version = "0.4", features = ["derive"], path = "../deps/sysfs-nav" }

# logging
log = "0.4"
simplelog = "0.12"

[build-dependencies]
usdpl-build = { version = "1.0", path = "../deps/usdpl-rs/usdpl-build" }

[profile.release]
debug = false
strip = true
lto = true
codegen-units = 4
